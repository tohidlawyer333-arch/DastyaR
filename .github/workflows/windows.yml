name: Build DastyaR for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download and verify Goose CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.55.0'
          $assetName = 'goose-x86_64-pc-windows-msvc.zip'
          $headers = @{ 'User-Agent' = 'DastyaR-GitHub-Actions'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/aaif-goose/goose/releases/tags/$tag" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "Official Goose release asset not found: $assetName ($tag)" }
          if (-not $asset.digest -or $asset.digest -notmatch '^sha256:([a-fA-F0-9]{64})$') {
            throw 'GitHub release metadata did not provide a valid SHA-256 digest; refusing an unverified Goose binary.'
          }
          $expected = $Matches[1].ToLower()
          New-Item -ItemType Directory -Force -Path resources/goose, .work/goose | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile .work/goose/goose.zip
          $actual = (Get-FileHash .work/goose/goose.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Goose SHA-256 mismatch. Expected $expected, got $actual" }
          Expand-Archive -Path .work/goose/goose.zip -DestinationPath .work/goose/extracted -Force
          $exe = Get-ChildItem .work/goose/extracted -Recurse -File | Where-Object { $_.Name -eq 'goose.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'goose.exe not found in official archive' }
          Copy-Item $exe.FullName resources/goose/goose.exe -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/aaif-goose/goose/$tag/LICENSE" -OutFile resources/goose/LICENSE-GOOSE.txt
          Get-Item resources/goose/goose.exe | Format-List Name,Length

      - name: Validate source syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check src/renderer.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer and portable ZIP
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DastyaR-Windows-Installers
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
